[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "codeatlas-ai"
version = "0.1.0"
description = "Static analysis and architecture documentation for Python repositories."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "CodeAtlas AI" }]
dependencies = [
    "networkx>=3.3,<4",
    "openai>=1.0,<3",
    "pydantic>=2.7,<3",
    "python-docx>=1.1,<2",
    "rich>=13.7,<14",
    "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = ["mypy>=1.10,<2", "pytest>=8.2,<9", "pytest-cov>=5,<6", "ruff>=0.5,<1"]

[project.scripts]
codeatlas = "codeatlas.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/codeatlas"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["tests/fixtures/project_with_syntax_error"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = ["networkx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["docx"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["openai"]
ignore_missing_imports = true
